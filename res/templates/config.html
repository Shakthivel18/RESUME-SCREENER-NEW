<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Configuration - NeuralHire</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a2942 100%);
            color: #e0e7ff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .logo-text h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text p {
            font-size: 12px;
            color: #00d4ff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Section Title */
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .section-title h2 {
            font-size: 28px;
            font-weight: 600;
        }

        .section-title .icon {
            font-size: 32px;
        }

        /* Button */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #0a1628;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e7ff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-danger {
            background: rgba(255, 59, 48, 0.2);
            color: #ff3b30;
            border: 1px solid rgba(255, 59, 48, 0.3);
        }

        .btn-danger:hover {
            background: rgba(255, 59, 48, 0.3);
        }

        /* Domains Grid */
        .domains-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .domain-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .domain-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 212, 255, 0.2);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .domain-card.custom {
            border-color: rgba(255, 184, 0, 0.3);
        }

        .domain-card.custom:hover {
            box-shadow: 0 12px 30px rgba(255, 184, 0, 0.2);
            border-color: rgba(255, 184, 0, 0.5);
        }

        .domain-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 16px;
        }

        .domain-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .domain-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-builtin {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
        }

        .badge-custom {
            background: rgba(255, 184, 0, 0.2);
            color: #ffb800;
        }

        .domain-stats {
            display: flex;
            gap: 20px;
            margin-top: 16px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #00d4ff;
        }

        .stat-label {
            font-size: 12px;
            color: #8b9dc3;
        }

        .domain-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a2942;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            color: #8b9dc3;
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        /* Form */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #e0e7ff;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e0e7ff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(255, 255, 255, 0.08);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-help {
            font-size: 12px;
            color: #8b9dc3;
            margin-top: 6px;
        }

        .tag-input-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            min-height: 100px;
        }

        .tag {
            padding: 6px 12px;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 6px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tag-remove {
            cursor: pointer;
            color: #ff3b30;
            font-weight: bold;
        }

        .tag-input {
            flex: 1;
            min-width: 150px;
            background: none;
            border: none;
            color: #e0e7ff;
            font-size: 14px;
            padding: 6px;
        }

        .tag-input:focus {
            outline: none;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 212, 255, 0.2);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 2px dashed rgba(255, 255, 255, 0.1);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-state-text {
            color: #8b9dc3;
            margin-bottom: 24px;
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            background: rgba(0, 212, 255, 0.9);
            color: #0a1628;
            border-radius: 12px;
            font-weight: 600;
            z-index: 2000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: rgba(255, 59, 48, 0.9);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon">📦</div>
                <div class="logo-text">
                    <h1>NEURALHIRE</h1>
                    <p>Operations Core</p>
                </div>
            </div>
            <button class="btn btn-primary" onclick="openCreateModal()">
                ➕ Create New Domain
            </button>
        </div>

        <!-- Section Title -->
        <div class="section-title">
            <span class="icon">⚙️</span>
            <h2>CONFIGURATION</h2>
        </div>

        <!-- Domains Grid -->
        <div id="domainsContainer" class="loading">
            <div class="spinner"></div>
            <p>Loading domains...</p>
        </div>
    </div>

    <!-- Create/Edit Domain Modal -->
    <div id="domainModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Create New Domain</h3>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>

            <form id="domainForm" onsubmit="saveDomain(event)">
                <div class="form-group">
                    <label class="form-label">Domain ID *</label>
                    <input type="text" id="domainId" class="form-input" required 
                           placeholder="e.g., BLOCKCHAIN_ENGINEERING">
                    <p class="form-help">Unique identifier (uppercase, underscores for spaces)</p>
                </div>

                <div class="form-group">
                    <label class="form-label">Domain Name *</label>
                    <input type="text" id="domainName" class="form-input" required 
                           placeholder="e.g., Blockchain Engineering">
                    <p class="form-help">Display name for this domain</p>
                </div>

                <div class="form-group">
                    <label class="form-label">Keywords *</label>
                    <div id="keywordsContainer" class="tag-input-container">
                        <input type="text" id="keywordInput" class="tag-input" 
                               placeholder="Type keyword and press Enter">
                    </div>
                    <p class="form-help">Technologies, tools, frameworks (press Enter to add)</p>
                </div>

                <div class="form-group">
                    <label class="form-label">Required Skills</label>
                    <div id="requiredSkillsContainer" class="tag-input-container">
                        <input type="text" id="requiredSkillInput" class="tag-input" 
                               placeholder="Type skill and press Enter">
                    </div>
                    <p class="form-help">Must-have skills for this domain</p>
                </div>

                <div class="form-group">
                    <label class="form-label">Nice to Have Skills</label>
                    <div id="niceToHaveContainer" class="tag-input-container">
                        <input type="text" id="niceToHaveInput" class="tag-input" 
                               placeholder="Type skill and press Enter">
                    </div>
                    <p class="form-help">Bonus skills that add value</p>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 32px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">
                        💾 Save Domain
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <script>
        let domains = [];
        let keywords = [];
        let requiredSkills = [];
        let niceToHave = [];
        let editingDomainId = null;

        // Load domains on page load
        window.addEventListener('DOMContentLoaded', loadDomains);

        async function loadDomains() {
            try {
                const response = await fetch('/api/domains');
                const data = await response.json();
                
                if (data.success) {
                    domains = data.domains;
                    renderDomains();
                } else {
                    showNotification('Failed to load domains', 'error');
                }
            } catch (error) {
                showNotification('Error loading domains: ' + error.message, 'error');
            }
        }

        function renderDomains() {
            const container = document.getElementById('domainsContainer');
            
            if (domains.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📦</div>
                        <h3 class="empty-state-title">No Domains Yet</h3>
                        <p class="empty-state-text">Create your first custom domain to get started</p>
                        <button class="btn btn-primary" onclick="openCreateModal()">
                            ➕ Create Domain
                        </button>
                    </div>
                `;
                return;
            }

            container.className = 'domains-grid';
            container.innerHTML = domains.map(domain => `
                <div class="domain-card ${domain.is_custom ? 'custom' : ''}" 
                     onclick="viewDomain('${domain.id}')">
                    <div class="domain-header">
                        <div>
                            <h3 class="domain-title">${domain.name}</h3>
                            <span class="domain-badge ${domain.is_custom ? 'badge-custom' : 'badge-builtin'}">
                                ${domain.is_custom ? 'Custom' : 'Built-in'}
                            </span>
                        </div>
                    </div>
                    <div class="domain-stats">
                        <div class="stat">
                            <div class="stat-value">${domain.keywords_count}</div>
                            <div class="stat-label">Keywords</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${domain.required_skills_count}</div>
                            <div class="stat-label">Required Skills</div>
                        </div>
                    </div>
                    ${domain.is_custom ? `
                        <div class="domain-actions" onclick="event.stopPropagation()">
                            <button class="btn btn-secondary" onclick="editDomain('${domain.id}')">
                                ✏️ Edit
                            </button>
                            <button class="btn btn-danger" onclick="deleteDomain('${domain.id}')">
                                🗑️ Delete
                            </button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function openCreateModal() {
            editingDomainId = null;
            document.getElementById('modalTitle').textContent = 'Create New Domain';
            document.getElementById('domainId').disabled = false;
            document.getElementById('domainForm').reset();
            keywords = [];
            requiredSkills = [];
            niceToHave = [];
            renderTags();
            document.getElementById('domainModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('domainModal').classList.remove('active');
        }

        async function viewDomain(domainId) {
            try {
                const response = await fetch(`/api/domains/${domainId}`);
                const data = await response.json();
                
                if (data.success) {
                    const domain = data.domain;
                    alert(`Domain: ${domain.name}\n\nKeywords: ${domain.keywords.join(', ')}\n\nRequired Skills: ${domain.required_skills.join(', ')}\n\nNice to Have: ${domain.nice_to_have.join(', ')}`);
                }
            } catch (error) {
                showNotification('Error loading domain details', 'error');
            }
        }

        async function editDomain(domainId) {
            try {
                const response = await fetch(`/api/domains/${domainId}`);
                const data = await response.json();
                
                if (data.success) {
                    const domain = data.domain;
                    editingDomainId = domainId;
                    
                    document.getElementById('modalTitle').textContent = 'Edit Domain';
                    document.getElementById('domainId').value = domainId;
                    document.getElementById('domainId').disabled = true;
                    document.getElementById('domainName').value = domain.name;
                    
                    keywords = domain.keywords || [];
                    requiredSkills = domain.required_skills || [];
                    niceToHave = domain.nice_to_have || [];
                    
                    renderTags();
                    document.getElementById('domainModal').classList.add('active');
                }
            } catch (error) {
                showNotification('Error loading domain', 'error');
            }
        }

        async function deleteDomain(domainId) {
            if (!confirm('Are you sure you want to delete this domain?')) return;
            
            try {
                const response = await fetch(`/api/domains/${domainId}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                
                if (data.success) {
                    showNotification('Domain deleted successfully');
                    loadDomains();
                } else {
                    showNotification(data.error || 'Failed to delete domain', 'error');
                }
            } catch (error) {
                showNotification('Error deleting domain', 'error');
            }
        }

        async function saveDomain(event) {
            event.preventDefault();
            
            const domainId = document.getElementById('domainId').value.toUpperCase().replace(/\s+/g, '_');
            const domainName = document.getElementById('domainName').value;
            
            if (keywords.length === 0) {
                showNotification('Please add at least one keyword', 'error');
                return;
            }
            
            const domainData = {
                id: domainId,
                name: domainName,
                keywords: keywords,
                required_skills: requiredSkills,
                nice_to_have: niceToHave
            };
            
            try {
                const url = editingDomainId ? `/api/domains/${editingDomainId}` : '/api/domains';
                const method = editingDomainId ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(domainData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showNotification(editingDomainId ? 'Domain updated successfully' : 'Domain created successfully');
                    closeModal();
                    loadDomains();
                } else {
                    showNotification(data.error || 'Failed to save domain', 'error');
                }
            } catch (error) {
                showNotification('Error saving domain: ' + error.message, 'error');
            }
        }

        // Tag input handling
        function setupTagInput(inputId, containerId, tagsArray) {
            const input = document.getElementById(inputId);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const value = input.value.trim().toLowerCase();
                    if (value && !tagsArray.includes(value)) {
                        tagsArray.push(value);
                        input.value = '';
                        renderTags();
                    }
                }
            });
        }

        function removeTag(array, index) {
            array.splice(index, 1);
            renderTags();
        }

        function renderTags() {
            renderTagList('keywordsContainer', 'keywordInput', keywords);
            renderTagList('requiredSkillsContainer', 'requiredSkillInput', requiredSkills);
            renderTagList('niceToHaveContainer', 'niceToHaveInput', niceToHave);
        }

        function renderTagList(containerId, inputId, tagsArray) {
            const container = document.getElementById(containerId);
            const input = document.getElementById(inputId);
            
            container.innerHTML = tagsArray.map((tag, index) => `
                <span class="tag">
                    ${tag}
                    <span class="tag-remove" onclick="removeTag(${containerId === 'keywordsContainer' ? 'keywords' : containerId === 'requiredSkillsContainer' ? 'requiredSkills' : 'niceToHave'}, ${index})">×</span>
                </span>
            `).join('') + input.outerHTML;
            
            // Re-setup event listener
            setupTagInput(inputId, containerId, tagsArray);
        }

        // Initialize tag inputs
        setupTagInput('keywordInput', 'keywordsContainer', keywords);
        setupTagInput('requiredSkillInput', 'requiredSkillsContainer', requiredSkills);
        setupTagInput('niceToHaveInput', 'niceToHaveContainer', niceToHave);

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = 'notification ' + (type === 'error' ? 'error' : '');
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
