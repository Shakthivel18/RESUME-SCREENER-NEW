        const AIInterviewPortal = ({ candidate, onClose }) => {
            const [showInterviewModal, setShowInterviewModal] = useState(true);

            // Re-map selectedResume to candidate
            const selectedResume = candidate;

            // Interview state
            // state moved to top
            const [interviewSession, setInterviewSession] = useState(null);
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [currentAnswer, setCurrentAnswer] = useState('');
            const [isEvaluating, setIsEvaluating] = useState(false);
            const [showInterviewResults, setShowInterviewResults] = useState(false);
            const [interviewResults, setInterviewResults] = useState(null);

            // Enterprise Upgrades
            const [showInstructions, setShowInstructions] = useState(true);
            const [timeLeft, setTimeLeft] = useState(120);
            const [isMicActive, setIsMicActive] = useState(false);
            const [proctorWarnings, setProctorWarnings] = useState(0);
            const [isTabActive, setIsTabActive] = useState(true);
            
            // Gaze Tracking Upgrades
            const [isLookingAway, setIsLookingAway] = useState(false);
            const videoElementRef = useRef(null);
            const canvasElementRef = useRef(null);
            const faceMeshRef = useRef(null);
            const cameraRef = useRef(null);
            const lookAwayTimerRef = useRef(null);
            const faceDisappearedTimerRef = useRef(null);

            // Enterprise Hooks


            useEffect(() => {
                const handleVisibility = () => {
                    if (document.hidden && showInterviewModal) {
                        setProctorWarnings(w => w + 1);
                        alert("⚠️ PROCTOR WARNING: Tab switching detected. This event has been logged.");
                    }
                };
                document.addEventListener('visibilitychange', handleVisibility);
                return () => document.removeEventListener('visibilitychange', handleVisibility);
            }, [showInterviewModal]);

            // Gaze tracking initialization
            useEffect(() => {
                if (!showInterviewModal || showInstructions || !interviewSession) return;

                if (window.FaceMesh && window.Camera) {
                    const faceMesh = new window.FaceMesh({
                        locateFile: (file) => {
                            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
                        }
                    });

                    faceMesh.setOptions({
                        maxNumFaces: 1,
                        refineLandmarks: true,
                        minDetectionConfidence: 0.5,
                        minTrackingConfidence: 0.5
                    });

                    faceMesh.onResults((results) => {
                        const canvasCtx = canvasElementRef.current?.getContext('2d');
                        if (!canvasCtx || !canvasElementRef.current || !videoElementRef.current) return;
                        
                        canvasCtx.save();
                        canvasCtx.clearRect(0, 0, canvasElementRef.current.width, canvasElementRef.current.height);
                        
                        // Draw mirrored video frame
                        canvasCtx.translate(canvasElementRef.current.width, 0);
                        canvasCtx.scale(-1, 1);
                        canvasCtx.drawImage(
                            results.image, 0, 0, canvasElementRef.current.width, canvasElementRef.current.height
                        );
                        canvasCtx.restore();
                        
                        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                            // Face is present
                            clearTimeout(faceDisappearedTimerRef.current);
                            faceDisappearedTimerRef.current = null;
                            
                            const landmarks = results.multiFaceLandmarks[0];
                            const noseTip = landmarks[1];
                            const leftEdge = landmarks[234];
                            const rightEdge = landmarks[454];
                            const topEdge = landmarks[10]; // top of forehead
                            const bottomEdge = landmarks[152]; // bottom of chin
                            
                            // Draw Face Mesh
                            canvasCtx.save();
                            canvasCtx.translate(canvasElementRef.current.width, 0);
                            canvasCtx.scale(-1, 1);
                            
                            if (window.drawConnectors) {
                                window.drawConnectors(canvasCtx, landmarks, window.FACEMESH_TESSELATION, {color: '#2EE6C830', lineWidth: 1});
                                window.drawConnectors(canvasCtx, landmarks, window.FACEMESH_RIGHT_EYE, {color: '#2EE6C8'});
                                window.drawConnectors(canvasCtx, landmarks, window.FACEMESH_LEFT_EYE, {color: '#2EE6C8'});
                                window.drawConnectors(canvasCtx, landmarks, window.FACEMESH_FACE_OVAL, {color: '#2EE6C850'});
                            }
                            
                            // Draw tracking dot on nose
                            const noseX = noseTip.x * canvasElementRef.current.width;
                            const noseY = noseTip.y * canvasElementRef.current.height;
                            canvasCtx.beginPath();
                            canvasCtx.arc(noseX, noseY, 5, 0, 2 * Math.PI);
                            canvasCtx.fillStyle = '#ef4444'; 
                            canvasCtx.fill();
                            canvasCtx.lineWidth = 2;
                            canvasCtx.strokeStyle = '#ffffff';
                            canvasCtx.stroke();
                            canvasCtx.restore();
                            
                            // Calculate yaw & pitch
                            const yawRatio = (noseTip.x - leftEdge.x) / (rightEdge.x - leftEdge.x);
                            const pitchRatio = (noseTip.y - topEdge.y) / (bottomEdge.y - topEdge.y);
                            
                            // Check if candidate is looking away (yaw) or above/below laptop (pitch)
                            // Increased sensitivity for looking up (pitchRatio < 0.43)
                            if (yawRatio < 0.25 || yawRatio > 0.75 || pitchRatio < 0.43 || pitchRatio > 0.65) {
                                // Looking away
                                if (!lookAwayTimerRef.current) {
                                    lookAwayTimerRef.current = setTimeout(() => {
                                        setIsLookingAway(true);
                                        setProctorWarnings(prev => prev + 1);
                                    }, 1500);
                                }
                            } else {
                                // Looking at screen
                                clearTimeout(lookAwayTimerRef.current);
                                lookAwayTimerRef.current = null;
                                setIsLookingAway(false);
                            }
                        } else {
                            // No face detected
                            if (!faceDisappearedTimerRef.current) {
                                faceDisappearedTimerRef.current = setTimeout(() => {
                                    setIsLookingAway(true);
                                    setProctorWarnings(prev => prev + 1);
                                }, 1500);
                            }
                        }
                    });

                    faceMeshRef.current = faceMesh;

                    const camera = new window.Camera(videoElementRef.current, {
                        onFrame: async () => {
                            if (videoElementRef.current && faceMeshRef.current) {
                                await faceMeshRef.current.send({image: videoElementRef.current});
                            }
                        },
                        width: 320,
                        height: 240
                    });
                    
                    camera.start();
                    cameraRef.current = camera;
                }

                return () => {
                    clearTimeout(lookAwayTimerRef.current);
                    clearTimeout(faceDisappearedTimerRef.current);
                    if (cameraRef.current) {
                        cameraRef.current.stop();
                    }
                    if (faceMeshRef.current) {
                        faceMeshRef.current.close();
                    }
                };
            }, [showInterviewModal, showInstructions, interviewSession]);

            // Voice Synthesis
            const speakQuestion = (text) => {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            };

            // Voice Recognition - Enhanced with proper instance management
            const recognitionRef = useRef(null);
            const [interimTranscript, setInterimTranscript] = useState('');

            const toggleMic = () => {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    alert("Speech recognition not supported in this browser. Please use Chrome, Edge, or Safari.");
                    return;
                }

                if (isMicActive) {
                    // Stop recognition
                    if (recognitionRef.current) {
                        recognitionRef.current.stop();
                        recognitionRef.current = null;
                    }
                    setIsMicActive(false);
                    setInterimTranscript('');
                } else {
                    // Start recognition
                    const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
                    const recognition = new SpeechRecognition();

                    recognition.continuous = true;
                    recognition.interimResults = true;
                    recognition.lang = 'en-US';
                    recognition.maxAlternatives = 1;

                    recognition.onstart = () => {
                        setIsMicActive(true);
                        console.log('🎤 Voice recognition started');
                    };

                    recognition.onend = () => {
                        setIsMicActive(false);
                        setInterimTranscript('');
                        console.log('🎤 Voice recognition ended');
                    };

                    recognition.onerror = (event) => {
                        console.error('Speech recognition error:', event.error);

                        if (event.error === 'no-speech') {
                            // Auto-restart if no speech detected
                            if (recognitionRef.current && isMicActive) {
                                setTimeout(() => {
                                    try { recognition.start(); } catch (e) { console.log(e); }
                                }, 100);
                            }
                        } else if (event.error === 'network') {
                            setIsMicActive(false);
                            setInterimTranscript('');
                            alert('Network error. Please check your internet connection.');
                        } else if (event.error === 'not-allowed') {
                            setIsMicActive(false);
                            setInterimTranscript('');
                            alert('Microphone access denied. Please allow microphone access in your browser settings.');
                        } else {
                            setIsMicActive(false);
                            setInterimTranscript('');
                        }
                    };

                    recognition.onresult = (event) => {
                        let interimText = '';
                        let finalText = '';

                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            const transcript = event.results[i][0].transcript;
                            if (event.results[i].isFinal) {
                                finalText += transcript + ' ';
                            } else {
                                interimText += transcript;
                            }
                        }

                        // Update interim results for live feedback
                        if (interimText) {
                            setInterimTranscript(interimText);
                        }

                        // Add final results to answer
                        if (finalText) {
                            setCurrentAnswer(prev => {
                                const newText = prev.trim() + ' ' + finalText.trim();
                                return newText.trim();
                            });
                            setInterimTranscript('');
                        }
                    };

                    recognitionRef.current = recognition;

                    try {
                        recognition.start();
                    } catch (error) {
                        console.error('Failed to start recognition:', error);
                        alert('Failed to start voice recognition. Please try again.');
                        setIsMicActive(false);
                    }
                }
            };

            // Cleanup recognition on unmount or when interview modal closes
            useEffect(() => {
                return () => {
                    if (recognitionRef.current) {
                        recognitionRef.current.stop();
                        recognitionRef.current = null;
                    }
                };
            }, []);

            // Stop recognition when modal closes
            useEffect(() => {
                if (!showInterviewModal && recognitionRef.current) {
                    recognitionRef.current.stop();
                    recognitionRef.current = null;
                    setIsMicActive(false);
                    setInterimTranscript('');
                }
            }, [showInterviewModal]);


            const [isStartingInterview, setIsStartingInterview] = useState(false);

            const startInterview = async (resume) => {
                if (isStartingInterview) return;
                setIsStartingInterview(true);

                try {
                    const res = await fetch('/api/interview/start', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            candidate_id: resume.id,
                            job_description: resume.job_description || `We are looking for a skilled professional in the ${resume.jd_domain || 'Software Engineering'} domain with strong technical expertise and problem-solving abilities.`,
                            domain: resume.jd_domain || 'SOFTWARE_ENGINEERING'
                        })
                    });

                    const data = await res.json();
                    if (data.success) {
                        setInterviewSession({ ...data.session, candidate_name: resume.name });
                        setCurrentQuestion(0);
                        setCurrentAnswer('');
                        setShowInterviewModal(true);
                    } else {
                        alert('Could not start interview: ' + (data.error || 'Unknown error'));
                    }
                } catch (err) {
                    console.error(err);
                    alert('Failed to connect to AI service. Please check your connection.');
                } finally {
                    setIsStartingInterview(false);
                }
            };

            const submitAnswer = async () => {
                if (!currentAnswer.trim()) {
                    alert('Please provide an answer');
                    return;
                }

                // Stop voice recognition if active
                if (recognitionRef.current) {
                    recognitionRef.current.stop();
                    recognitionRef.current = null;
                    setIsMicActive(false);
                    setInterimTranscript('');
                }

                setIsEvaluating(true);

                // Capture values before async operation to avoid closure issues
                const totalQuestions = interviewSession.questions.length;
                const currentQ = currentQuestion;

                try {
                    const question = interviewSession.questions[currentQuestion];
                    const answerText = currentAnswer; // Capture before state changes

                    console.log('Submitting answer for question:', currentQ, question.question);

                    const res = await fetch('/api/interview/answer', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            candidate_id: interviewSession.candidate_id,
                            question: question.question,
                            answer: answerText,
                            question_index: currentQuestion
                        })
                    });

                    if (!res.ok) {
                        throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                    }

                    const data = await res.json();
                    console.log('Evaluation response:', data);

                    if (data.success && data.evaluation) {
                        const updatedAnswers = [...(interviewSession.answers || [])];
                        // Ensure array is big enough
                        while (updatedAnswers.length <= currentQuestion) updatedAnswers.push({});

                        updatedAnswers[currentQuestion] = {
                            question: question.question,
                            answer: answerText,
                            evaluation: data.evaluation
                        };

                        console.log('Updating session with answers:', updatedAnswers);

                        // Update session state properly - use functional update
                        setInterviewSession(prev => {
                            if (!prev) {
                                console.error('Interview session is null!');
                                return prev;
                            }
                            return {
                                ...prev,
                                answers: updatedAnswers
                            };
                        });

                        // Auto-advance logic
                        setTimeout(() => {
                            console.log('Finishing evaluation, advancing if needed');
                            setIsEvaluating(false);
                            if (currentQ < totalQuestions - 1) {
                                setCurrentQuestion(currentQ + 1);
                                setCurrentAnswer('');

                            }
                        }, 2500);
                    } else {
                        console.error('Evaluation failed:', data);
                        alert('Evaluation failed - ' + (data.error || 'No evaluation returned'));
                        setIsEvaluating(false);
                    }
                } catch (err) {
                    console.error('Submit answer error:', err);
                    setIsEvaluating(false);
                    alert('Network error submitting answer: ' + err.message);
                }
            };

            const completeInterview = async () => {
                try {
                    const res = await fetch('/api/interview/complete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            candidate_id: interviewSession.candidate_id,
                            session: interviewSession
                        })

                    if (data.success) {

                            overall_score: data.overall_score,
                            filename: data.filename
                        };
                        setInterviewResults(resultsData);
                        setShowInterviewModal(false);
                        setShowInterviewResults(true);
                        // fetchStatuses removed from candidate side
                    }
                } catch (err) { console.error(err); alert('Failed to save interview'); }
            };


            // Auto initialization hook removed - now manual via instructions button
            useEffect(() => {
                // if (candidate && !interviewSession && !showInterviewResults) {
                //     startInterview(candidate);
                // }
            }, [candidate]);

            if (!showInterviewModal && !showInterviewResults) return null;

            return (
                <div style={{ position: 'fixed', inset: 0, zIndex: 10000, background: 'rgba(0,0,0,0.92)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px' }}>

                            <div style={{ display: 'flex', alignItems: 'center', gap: '16px', marginBottom: '24px' }}>

                                </div>
                                <h2 style={{ fontSize: '24px', fontWeight: 900, color: '#fff' }}>Assessment Instructions</h2>
                            </div>

                            <div style={{ color: 'rgba(255,255,255,0.7)', fontSize: '14px', lineHeight: '1.6', marginBottom: '32px' }}>

                                    </li>
                                    <li style={{ display: 'flex', gap: '12px' }}>
                                        <i className="fas fa-ban" style={{ marginTop: '4px', color: '#EBC96E' }}></i>
                                        <span>Navigation restrictions apply. You cannot skip questions and return to them later. The test must be completed in the given sequence.</span>
                                    </li>

                                        <span>Please read each question carefully before answering, as there will be no opportunity to go back or reattempt the question. Any attempt to bypass these rules may result in automatic disqualification.</span>

                                </ul>

                                <p style={{ marginTop: '24px', fontSize: '12px', fontStyle: 'italic', background: 'rgba(255,255,255,0.05)', padding: '16px', borderRadius: '12px', borderLeft: '3px solid #EBC96E' }}>

                    {/* Loading overlay */}
                    {isStartingInterview && (

                                {interviewResults.candidate_name}

                            {interviewResults.overall_score !== undefined && (

                                    <div style={{ fontSize: '11px', fontWeight: 700, color: 'rgba(255,255,255,0.4)', textTransform: 'uppercase', letterSpacing: '0.2em', marginTop: '4px' }}>Overall Score / 10</div>

                            <button onClick={onClose} style={{ width: '100%', padding: '16px', background: '#2EE6C8', color: '#0C2224', fontWeight: 900, fontSize: '14px', textTransform: 'uppercase', letterSpacing: '0.15em', border: 'none', borderRadius: '16px', cursor: 'pointer' }}>

                    {/* Interview Question Panel */}
                    {showInterviewModal && interviewSession && !isStartingInterview && (

                                    <button onClick={onClose} style={{ width: '36px', height: '36px', borderRadius: '50%', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', color: 'rgba(255,255,255,0.4)', cursor: 'pointer', fontSize: '14px' }}>
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                            </div>

                            {/* Main Body Layout */}
                            <div style={{ display: 'flex', flex: 1, overflow: 'hidden' }}>
                                {/* Left Side: Question and Answer */}
                                <div style={{ padding: '32px', flex: 1, overflowY: 'auto', display: 'flex', flexDirection: 'column' }}>
                                    <div style={{ background: 'rgba(46,230,200,0.05)', border: '1px solid rgba(46,230,200,0.15)', borderRadius: '20px', padding: '24px', marginBottom: '24px' }}>
                                        <div style={{ fontSize: '10px', fontWeight: 700, color: '#2EE6C8', textTransform: 'uppercase', letterSpacing: '0.25em', marginBottom: '12px' }}>
                                            <i className="fas fa-robot" style={{ marginRight: '8px' }}></i>Question {currentQuestion + 1}
                                        </div>
                                        <div style={{ fontSize: '17px', fontWeight: 600, color: '#fff', lineHeight: 1.6 }}>
                                            {typeof (interviewSession.questions || [])[currentQuestion] === 'object'
                                                ? (interviewSession.questions || [])[currentQuestion]?.question
                                                : (interviewSession.questions || [])[currentQuestion]}
                                        </div>
                                    </div>

                                    {/* Evaluation feedback for previous answer */}
                                    {interviewSession.answers && interviewSession.answers[currentQuestion - 1]?.evaluation && (
                                        <div style={{ background: 'rgba(235,201,110,0.06)', border: '1px solid rgba(235,201,110,0.2)', borderRadius: '16px', padding: '16px', marginBottom: '24px' }}>
                                            <div style={{ fontSize: '10px', fontWeight: 700, color: '#EBC96E', textTransform: 'uppercase', letterSpacing: '0.2em', marginBottom: '8px' }}>Previous Answer Score: {interviewSession.answers[currentQuestion - 1]?.score || '—'}/10</div>
                                            <div style={{ fontSize: '13px', color: 'rgba(255,255,255,0.5)', lineHeight: 1.5 }}>{interviewSession.answers[currentQuestion - 1]?.evaluation?.feedback}</div>
                                        </div>
                                    )}

                                    {/* Answer area */}
                                    <div style={{ marginBottom: '16px', flex: 1, display: 'flex', flexDirection: 'column' }}>
                                        <div style={{ fontSize: '10px', fontWeight: 700, color: 'rgba(255,255,255,0.4)', textTransform: 'uppercase', letterSpacing: '0.2em', marginBottom: '10px' }}>Your Answer</div>
                                        <div style={{ position: 'relative', flex: 1, display: 'flex', flexDirection: 'column' }}>

                                                value={currentAnswer + (interimTranscript ? ' ' + interimTranscript : '')}

                                                style={{ width: '100%', flex: 1, minHeight: '130px', background: 'rgba(0,0,0,0.3)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '16px', padding: '16px', color: '#2EE6C8', fontSize: '14px', lineHeight: 1.6, outline: 'none', resize: 'vertical', boxSizing: 'border-box', opacity: isEvaluating ? 0.5 : 1, fontFamily: 'inherit' }}
                                            />
                                            {isMicActive && (
                                                <div style={{ position: 'absolute', top: '10px', right: '12px', display: 'flex', alignItems: 'center', gap: '6px', background: 'rgba(239,68,68,0.2)', border: '1px solid rgba(239,68,68,0.4)', borderRadius: '20px', padding: '4px 10px' }}>
                                                    <div style={{ width: '8px', height: '8px', borderRadius: '50%', background: '#ef4444', animation: 'pulse 1s infinite' }}></div>
                                                    <span style={{ fontSize: '10px', fontWeight: 700, color: '#f87171' }}>LIVE</span>
                                                </div>

                                        </div>
                                    </div>
                                </div>

                                {/* Right Side: Camera */}
                                <div style={{ width: '380px', padding: '32px 32px 32px 0', display: 'flex', flexDirection: 'column', flexShrink: 0 }}>

                                        <canvas ref={canvasElementRef} width="320" height="240" style={{ width: '100%', height: '100%', objectFit: 'cover' }}></canvas>

                                    <div style={{ marginTop: '20px', textAlign: 'center', background: 'rgba(0,0,0,0.2)', padding: '16px', borderRadius: '12px', border: '1px solid rgba(255,255,255,0.05)' }}>
                                        <div style={{ fontSize: '11px', fontWeight: 900, color: '#2EE6C8', textTransform: 'uppercase', letterSpacing: '0.2em' }}><i className="fas fa-eye mr-2"></i> Eye Contact Tracking</div>
                                        <div style={{ fontSize: '12px', color: 'rgba(255,255,255,0.5)', marginTop: '8px', lineHeight: 1.5, fontStyle: 'italic' }}>Please ensure your face is clearly visible and look directly at the screen to avoid proctor flags.</div>

                            <div style={{ padding: '20px 32px', borderTop: '1px solid rgba(255,255,255,0.06)', background: 'rgba(21,50,53,0.6)', display: 'flex', gap: '12px', alignItems: 'center' }}>
                                <button
                                    onClick={toggleMic}
                                    disabled={isEvaluating}
                                    style={{ width: '52px', height: '52px', borderRadius: '50%', background: isMicActive ? 'rgba(239,68,68,0.2)' : 'rgba(255,255,255,0.05)', border: isMicActive ? '2px solid rgba(239,68,68,0.5)' : '1px solid rgba(255,255,255,0.1)', color: isMicActive ? '#f87171' : 'rgba(255,255,255,0.4)', cursor: 'pointer', fontSize: '18px', flexShrink: 0, transition: 'all 0.2s' }}
                                >
                                    <i className={`fas fa-microphone${isMicActive ? '-slash' : ''}`}></i>

                                <div style={{ flex: 1 }}></div>

                                {isEvaluating ? (
                                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: '14px 24px', background: 'rgba(46,230,200,0.08)', border: '1px solid rgba(46,230,200,0.2)', borderRadius: '14px', color: '#2EE6C8', fontWeight: 700, fontSize: '13px' }}>
                                        <div style={{ width: '16px', height: '16px', border: '2px solid #2EE6C8', borderTopColor: 'transparent', borderRadius: '50%', animation: 'spin 0.6s linear infinite' }}></div>
                                        Evaluating...
                                    </div>
                                ) : currentQuestion < (interviewSession.questions || []).length - 1 ? (
                                    <button
                                        onClick={submitAnswer}
                                        style={{ padding: '14px 32px', background: 'linear-gradient(135deg, #2EE6C8, #10b981)', color: '#0C2224', border: 'none', borderRadius: '14px', fontWeight: 900, fontSize: '13px', textTransform: 'uppercase', letterSpacing: '0.15em', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '8px' }}
                                    >
                                        Submit & Next <i className="fas fa-arrow-right"></i>
                                    </button>
                                ) : (
                                    <button
                                        onClick={completeInterview}
                                        style={{ padding: '14px 32px', background: 'linear-gradient(135deg, #EBC96E, #f59e0b)', color: '#0C2224', border: 'none', borderRadius: '14px', fontWeight: 900, fontSize: '13px', textTransform: 'uppercase', letterSpacing: '0.15em', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '8px' }}
                                    >
                                        <i className="fas fa-flag-checkered"></i> Finish Interview
                                    </button>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const CandidateDashboard = ({ onBack }) => {
            const [viewMode, setViewMode] = useState('upload'); // 'upload', 'interview_login', 'status_check'
            const [uploadStatus, setUploadStatus] = useState('');
            const [uploadedFile, setUploadedFile] = useState(null);
            const [referenceId, setReferenceId] = useState(null);

            // Interview Login State
            const [loginRef, setLoginRef] = useState('');
            const [loginError, setLoginError] = useState('');
            const [activeCandidate, setActiveCandidate] = useState(null);

            // Status Check State
            const [statusRef, setStatusRef] = useState('');
            const [statusError, setStatusError] = useState('');
            const [candidateStatusData, setCandidateStatusData] = useState(null);

            const handleUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const formData = new FormData();
                formData.append('resume', file);

                setUploadStatus('UP-LINKING...');
                setReferenceId(null);
                try {
                    const res = await fetch('/api/upload-resume', { method: 'POST', body: formData });
                    const data = await res.json();

                    if (res.ok) {
                        setUploadStatus('TRANSFER COMPLETE');
                        setUploadedFile(data.filename);
                        setReferenceId(data.reference_id);
                    } else {
                        setUploadStatus('ERR: CONNECTION LOST - ' + (data.message || 'Unknown error'));
                    }
                } catch (err) {
                    setUploadStatus('ERR: NET_DOWN - ' + err.message);
                }
            };

            const [showInterview, setShowInterview] = useState(false);

            const handleInterviewLogin = async (e) => {
                e.preventDefault();
                setLoginError('');
                if (!loginRef.trim()) return;
                try {
                    const res = await fetch('/api/candidate/by-ref/' + encodeURIComponent(loginRef.trim()));
                    const data = await res.json();
                    if (!data.success) {
                        setLoginError(data.error || 'Invalid Reference ID');
                        return;
                    }
                    if (!data.finalized) {
                        setLoginError('You have not been cleared for the AI interview yet. Please check back after your application is reviewed.');
                        return;
                    }
                    setActiveCandidate({
                        id: data.candidate_id,
                        name: data.name,
                        ref_id: data.ref_id,
                        recruiter_message: data.recruiter_message || ''
                    });
                } catch (err) {
                    setLoginError('Connection Error — is the server running?');
                }
            };

            const handleStatusCheck = async (e) => {
                e.preventDefault();
                setStatusError('');
                if (!statusRef.trim()) return;
                try {
                    const res = await fetch('/api/candidate/by-ref/' + encodeURIComponent(statusRef.trim()));
                    const data = await res.json();
                    if (!data.success) {
                        setStatusError(data.error || 'Invalid Reference ID');
                        return;
                    }

                    // Map backend status to user-friendly string
                    let displayStatus = 'Processing...';
                    const backendStatus = data.status || 'new';

                    if (backendStatus === 'new') displayStatus = 'Resume under process';
                    else if (backendStatus === 'shortlisted') displayStatus = 'Shortlisted';
                    else if (backendStatus === 'finalized') displayStatus = 'AI Interview Pending';
                    else if (backendStatus === 'interviewed') displayStatus = 'Review process';
                    else if (backendStatus === 'hired') displayStatus = 'Hired';
                    else if (backendStatus === 'rejected') displayStatus = 'Offline commit called off';

                    setCandidateStatusData({
                        name: data.name,
                        displayStatus: displayStatus,
                        rawStatus: backendStatus,
                        message: data.recruiter_message
                    });
                } catch (err) {
                    setStatusError('Connection Error — is the server running?');
                }
            };

            return (
                <>
                    <motion.div
                        initial={{ opacity: 0 }}
                        animate={{ opacity: 1 }}
                        className="flex h-screen w-screen items-center justify-center relative"
                    >
                        <div className="absolute top-10 left-10 cursor-pointer z-50 group" onClick={onBack}>
                            <div className="flex items-center gap-3 text-forest-900 hover:text-forest-950 transition-colors font-black uppercase tracking-widest text-sm">
                                <i className="fas fa-chevron-left"></i>
                                <span>Return</span>
                            </div>
                        </div>

                        <div className="absolute top-10 right-10 z-50 flex gap-4">
                            <button
                                onClick={() => setViewMode(viewMode === 'upload' ? 'status_check' : 'upload')}
                                className={`px-6 py-3 ${viewMode === 'status_check' ? 'bg-forest-900 text-tropical-400' : 'bg-forest-900/80 hover:bg-forest-900 text-white'} rounded-2xl font-black uppercase tracking-widest shadow-xl transition-all flex items-center gap-2 border border-white/10`}
                            >
                                {viewMode === 'upload' ? <><i className="fas fa-search"></i> Check Status</> : <><i className="fas fa-file-upload"></i> Upload</>}
                            </button>
                            <button
                                onClick={() => setViewMode('interview_login')}
                                className={`px-6 py-3 ${viewMode === 'interview_login' ? 'bg-gold-500 text-forest-900 border-gold-400' : 'bg-forest-900 text-gold-400 hover:bg-forest-800 border-gold-400/30'} border rounded-2xl font-black uppercase tracking-widest shadow-lg transition-all flex items-center gap-2`}
                            >
                                <i className="fas fa-video"></i> Top Tier Potential
                            </button>
                        </div>

                        <div className="text-center max-w-2xl w-full p-12 glass-panel rounded-[3rem] shadow-2xl relative overflow-hidden">
                            {/* HEX PATTERN */}
                            <div className="absolute inset-0 bg-hex-lattice opacity-40 pointer-events-none"></div>

                            {viewMode === 'upload' ? (
                                <>
                                    <div className="mb-10 relative z-10">
                                        <div className="w-24 h-24 mx-auto bg-forest-900 rounded-3xl flex items-center justify-center mb-6 shadow-[0_10px_30px_rgba(0,0,0,0.3)]">
                                            <i className="fas fa-cloud-upload-alt text-4xl text-tropical-400"></i>
                                        </div>
                                        <h1 className="text-5xl font-black text-white mb-2">GRID LINK</h1>
                                        <p className="text-tropical-300 font-bold uppercase tracking-widest text-sm opacity-80">Secure Neural Link: ACTIVE</p>
                                    </div>

                                    {!uploadedFile ? (
                                        <div className="relative group p-16 bg-forest-900/40 hover:bg-forest-900/60 transition-all cursor-pointer rounded-3xl overflow-hidden z-10">
                                            <div className="absolute inset-0 border-4 border-dashed border-white/20 group-hover:border-tropical-400 transition-colors rounded-3xl"></div>
                                            <input type="file" onChange={handleUpload} accept=".pdf,.docx,.doc" className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" />
                                            <div className="flex flex-col items-center gap-6 relative z-10">
                                                <i className="fas fa-file-pdf text-6xl text-white/50 group-hover:text-tropical-400 group-hover:scale-110 transition-all"></i>
                                                <div>
                                                    <p className="font-black text-white text-2xl uppercase tracking-wide">Inject Data Stream</p>
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="p-10 bg-tropical-400/20 rounded-3xl z-10 relative border border-tropical-400/30">
                                            <i className="fas fa-check-circle text-6xl text-tropical-400 mb-6 block drop-shadow-lg"></i>
                                            <h3 className="text-2xl font-black text-white uppercase tracking-wide mb-2">Transfer Complete</h3>

                                            {referenceId && (
                                                <div className="mt-6 bg-forest-950/80 p-6 rounded-2xl border border-tropical-400/50 shadow-[0_0_20px_rgba(46,230,200,0.2)]">
                                                    <p className="text-white/60 text-xs font-bold uppercase tracking-widest mb-3">Your Reference ID</p>
                                                    <div className="text-4xl font-mono text-gold-400 tracking-wider flex items-center justify-center gap-4">
                                                        {referenceId}
                                                        <button onClick={() => { navigator.clipboard.writeText(referenceId); alert('Copied!'); }} className="w-10 h-10 rounded-full bg-white/5 hover:bg-tropical-400 hover:text-forest-900 border border-white/10 flex items-center justify-center text-sm transition-all shadow-md active:scale-95" title="Copy to clipboard">
                                                            <i className="fas fa-copy"></i>
                                                        </button>
                                                    </div>
                                                    <p className="text-tropical-400 text-[10px] mt-4 uppercase tracking-widest border-t border-white/10 pt-3">Save this ID to enter the Top Tier Potential portal</p>
                                                </div>
                                            )}

                                            <button onClick={() => { setUploadedFile(null); setReferenceId(null); setUploadStatus(''); }} className="mt-8 px-8 py-4 bg-white/10 hover:bg-white hover:text-forest-900 font-black uppercase tracking-widest transition-all rounded-xl border border-white/20">Upload Another</button>
                                        </div>
                                    )}

                                    <div className="mt-10 font-black text-sm text-tropical-300 h-6 uppercase tracking-widest relative z-10">
                                        {uploadStatus}
                                    </div>
                                </>
                            ) : viewMode === 'interview_login' ? (
                                <>
                                    <div className="mb-10 relative z-10">
                                        <div className="w-24 h-24 mx-auto bg-gold-400/20 rounded-3xl flex items-center justify-center mb-6 shadow-[0_10px_30px_rgba(212,175,55,0.2)] border border-gold-400/30">
                                            <i className="fas fa-certificate text-4xl text-gold-400"></i>
                                        </div>
                                        <h1 className="text-4xl font-black text-white mb-2">TOP TIER POTENTIAL</h1>
                                        <p className="text-gold-300 font-bold uppercase tracking-widest text-sm opacity-80">Phase 2: AI Neural Interview</p>
                                    </div>

                                    {!activeCandidate ? (
                                        <form onSubmit={handleInterviewLogin} className="flex flex-col gap-6 relative z-10 text-left mt-8">
                                            <div>
                                                <label className="text-xs font-bold text-tropical-400 uppercase tracking-widest ml-2 mb-2 block">Reference ID</label>
                                                <input
                                                    type="text"
                                                    value={loginRef}
                                                    onChange={e => setLoginRef(e.target.value.toUpperCase())}
                                                    className="w-full bg-forest-950/80 rounded-2xl py-5 px-6 text-tropical-400 font-mono text-xl outline-none border border-white/10 focus:border-gold-400/50 focus:shadow-[0_0_20px_rgba(212,175,55,0.2)] transition-all uppercase tracking-widest text-center"
                                                    placeholder="REF-XXXXXX"
                                                    required
                                                />
                                            </div>

                                            {loginError && <div className="text-red-300 text-xs font-black bg-red-900/40 py-3 rounded-xl text-center border border-red-500/30">{loginError}</div>}

                                            <button type="submit" className="py-5 mt-2 bg-gradient-to-r from-gold-500 to-gold-400 text-forest-900 font-black rounded-2xl text-lg uppercase tracking-widest transform hover:scale-[1.02] shadow-[0_10px_30px_rgba(212,175,55,0.4)] transition-all">
                                                Initiate Session
                                            </button>
                                        </form>
                                    ) : (
                                        <div style={{ padding: '32px', background: 'rgba(12,34,36,0.6)', borderRadius: '24px', border: '1px solid rgba(212,175,55,0.3)', position: 'relative', zIndex: 10 }}>
                                            <div style={{ width: '72px', height: '72px', borderRadius: '50%', background: 'rgba(16,185,129,0.15)', border: '2px solid rgba(16,185,129,0.4)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 16px' }}>
                                                <i className="fas fa-user-check" style={{ fontSize: '28px', color: '#34d399' }}></i>
                                            </div>
                                            <div style={{ fontSize: '11px', fontWeight: 700, color: 'rgba(255,255,255,0.4)', textTransform: 'uppercase', letterSpacing: '0.25em', marginBottom: '6px' }}>Verified Candidate</div>
                                            <div style={{ fontSize: '22px', fontWeight: 900, color: '#fff', marginBottom: '4px' }}>{activeCandidate.name || activeCandidate.id}</div>
                                            <div style={{ fontSize: '13px', fontWeight: 700, color: '#EBC96E', fontFamily: 'monospace', marginBottom: '24px', letterSpacing: '0.15em' }}>{activeCandidate.ref_id || loginRef}</div>
                                            <div style={{ fontSize: '11px', background: 'rgba(16,185,129,0.1)', border: '1px solid rgba(16,185,129,0.3)', borderRadius: '12px', padding: '10px 16px', color: '#34d399', marginBottom: '28px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.1em' }}>
                                                <i className="fas fa-check-circle" style={{ marginRight: '6px' }}></i> Cleared for AI Interview
                                            </div>
                                            <button
                                                onClick={() => setShowInterview(true)}
                                                style={{ width: '100%', padding: '18px', background: 'linear-gradient(135deg, #2EE6C8, #10b981)', color: '#0C2224', fontWeight: 900, fontSize: '15px', textTransform: 'uppercase', letterSpacing: '0.15em', border: 'none', borderRadius: '16px', cursor: 'pointer', boxShadow: '0 10px 40px rgba(46,230,200,0.35)', transition: 'all 0.2s' }}
                                                onMouseEnter={e => e.currentTarget.style.transform = 'scale(1.02)'}
                                                onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}
                                            >
                                                <i className="fas fa-play" style={{ marginRight: '10px' }}></i> Launch AI Interview
                                            </button>

                                            {activeCandidate.recruiter_message && (
                                                <div style={{ marginTop: '24px', padding: '16px', background: 'rgba(235,201,110,0.1)', border: '1px solid rgba(235,201,110,0.3)', borderRadius: '14px', textAlign: 'left' }}>
                                                    <div style={{ fontSize: '10px', fontWeight: 900, color: '#EBC96E', textTransform: 'uppercase', letterSpacing: '0.2em', marginBottom: '8px' }}>
                                                        <i className="fas fa-comment-alt" style={{ marginRight: '6px' }}></i> Message from Recruiter
                                                    </div>
                                                    <div style={{ fontSize: '13px', color: 'rgba(255,255,255,0.8)', lineHeight: 1.5, fontStyle: 'italic' }}>
                                                        "{activeCandidate.recruiter_message}"
                                                    </div>
                                                </div>
                                            )}

                                            <button onClick={() => { setActiveCandidate(null); setLoginRef(''); }} style={{ marginTop: '12px', width: '100%', padding: '12px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '14px', color: 'rgba(255,255,255,0.5)', fontWeight: 700, fontSize: '12px', textTransform: 'uppercase', cursor: 'pointer' }}>
                                                Use Different ID
                                            </button>
                                        </div>
                                    )}
                                </>
                            ) : viewMode === 'status_check' ? (
                                <>
                                    <div className="mb-10 relative z-10">
                                        <div className="w-24 h-24 mx-auto bg-blue-500/20 rounded-3xl flex items-center justify-center mb-6 shadow-[0_10px_30px_rgba(59,130,246,0.2)] border border-blue-500/30">
                                            <i className="fas fa-search text-4xl text-blue-400"></i>
                                        </div>
                                        <h1 className="text-4xl font-black text-white mb-2">APPLICATION STATUS</h1>
                                        <p className="text-blue-300 font-bold uppercase tracking-widest text-sm opacity-80">Track your progress</p>
                                    </div>

                                    {!candidateStatusData ? (
                                        <form onSubmit={handleStatusCheck} className="flex flex-col gap-6 relative z-10 text-left mt-8">
                                            <div>
                                                <label className="text-xs font-bold text-blue-400 uppercase tracking-widest ml-2 mb-2 block">Reference ID</label>
                                                <input
                                                    type="text"
                                                    value={statusRef}
                                                    onChange={e => setStatusRef(e.target.value.toUpperCase())}
                                                    className="w-full bg-forest-950/80 rounded-2xl py-5 px-6 text-tropical-400 font-mono text-xl outline-none border border-white/10 focus:border-blue-400/50 focus:shadow-[0_0_20px_rgba(59,130,246,0.2)] transition-all uppercase tracking-widest text-center"
                                                    placeholder="REF-XXXXXX"
                                                    required
                                                />
                                            </div>

                                            {statusError && <div className="text-red-300 text-xs font-black bg-red-900/40 py-3 rounded-xl text-center border border-red-500/30">{statusError}</div>}

                                            <button type="submit" className="py-5 mt-2 bg-gradient-to-r from-blue-500 to-blue-400 text-white font-black rounded-2xl text-lg uppercase tracking-widest transform hover:scale-[1.02] shadow-[0_10px_30px_rgba(59,130,246,0.3)] transition-all drop-shadow-md">
                                                Check Status
                                            </button>
                                        </form>
                                    ) : (
                                        <div style={{ padding: '32px', background: 'rgba(12,34,36,0.6)', borderRadius: '24px', border: '1px solid rgba(59,130,246,0.3)', position: 'relative', zIndex: 10 }}>
                                            <div style={{ fontSize: '11px', fontWeight: 700, color: 'rgba(255,255,255,0.4)', textTransform: 'uppercase', letterSpacing: '0.25em', marginBottom: '6px' }}>Candidate Name</div>
                                            <div style={{ fontSize: '24px', fontWeight: 900, color: '#fff', marginBottom: '24px' }}>{candidateStatusData.name}</div>

                                            <div style={{ padding: '24px', background: 'rgba(0,0,0,0.3)', borderRadius: '16px', border: '1px solid rgba(255,255,255,0.05)', marginBottom: '24px' }}>
                                                <div style={{ fontSize: '11px', fontWeight: 700, color: 'rgba(255,255,255,0.4)', textTransform: 'uppercase', letterSpacing: '0.25em', marginBottom: '12px' }}>Current Status</div>
                                                <div style={{ fontSize: '20px', fontWeight: 900, color: '#60a5fa', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '12px' }}>
                                                    {candidateStatusData.rawStatus === 'new' && <i className="fas fa-file-alt"></i>}
                                                    {candidateStatusData.rawStatus === 'shortlisted' && <i className="fas fa-star" style={{ color: '#fcd34d' }}></i>}
                                                    {candidateStatusData.rawStatus === 'finalized' && <i className="fas fa-video" style={{ color: '#34d399' }}></i>}
                                                    {candidateStatusData.rawStatus === 'interviewed' && <i className="fas fa-user-clock" style={{ color: '#a78bfa' }}></i>}
                                                    {candidateStatusData.rawStatus === 'hired' && <i className="fas fa-check-circle" style={{ color: '#10b981' }}></i>}
                                                    {candidateStatusData.rawStatus === 'rejected' && <i className="fas fa-times-circle" style={{ color: '#ef4444' }}></i>}
                                                    {candidateStatusData.displayStatus}
                                                </div>
                                            </div>

                                            {candidateStatusData.message && (
                                                <div style={{ padding: '20px', background: 'rgba(235,201,110,0.1)', border: '1px solid rgba(235,201,110,0.3)', borderRadius: '16px', textAlign: 'left' }}>
                                                    <div style={{ fontSize: '11px', fontWeight: 900, color: '#EBC96E', textTransform: 'uppercase', letterSpacing: '0.2em', marginBottom: '8px' }}>
                                                        <i className="fas fa-comment-alt" style={{ marginRight: '6px' }}></i> Message from Recruiter
                                                    </div>
                                                    <div style={{ fontSize: '14px', color: '#fff', lineHeight: 1.6, fontStyle: 'italic' }}>
                                                        "{candidateStatusData.message}"
                                                    </div>
                                                </div>
                                            )}

                                            <button onClick={() => { setCandidateStatusData(null); setStatusRef(''); }} style={{ marginTop: '24px', width: '100%', padding: '16px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '16px', color: 'rgba(255,255,255,0.7)', fontWeight: 700, fontSize: '13px', textTransform: 'uppercase', cursor: 'pointer', transition: 'all 0.2s' }} onMouseEnter={e => e.currentTarget.style.background = 'rgba(255,255,255,0.1)'} onMouseLeave={e => e.currentTarget.style.background = 'rgba(255,255,255,0.05)'}>
                                                Check Another ID
                                            </button>
                                        </div>
                                    )}
                                </>
                            ) : null}
                        </div>
                    </motion.div>
                    {showInterview && activeCandidate && (
                        <AIInterviewPortal
                            candidate={{ id: activeCandidate.id, name: activeCandidate.name, ref_id: activeCandidate.ref_id }}
                            onClose={() => { setShowInterview(false); setActiveCandidate(null); setLoginRef(''); }}
                        />
                    )}
                </>
            );
        };

        const App = () => {
            const [view, setView] = useState('hero');
            return (
                <div className="font-sans text-slate-200 antialiased selection:bg-tropical-400 selection:text-forest-900">
                    <AnimatePresence mode="wait">
                        {view === 'hero' && <Hero key="hero" onComplete={() => setView('landing')} />}
                        {view === 'landing' && <LandingPage key="landing" onSelectRole={(role) => setView(role)} />}
                        {view === 'login' && <LoginPage key="login" onLogin={() => setView('recruiter')} onBack={() => setView('landing')} />}
                        {view === 'candidate' && <CandidateDashboard key="candidate" onBack={() => setView('landing')} />}
                        {view === 'recruiter' && <RecruiterDashboard key="recruiter" onLogout={() => setView('landing')} />}
                    </AnimatePresence>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
